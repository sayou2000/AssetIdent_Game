# AssetIdent game — nginx server config
# Listens on 8080 so the container can run under Coolify / standard hosts without
# needing a privileged port.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root         /usr/share/nginx/html;
    index        index.html;

    # MIME types come from the base image's /etc/nginx/mime.types (included in the
    # http block). An inline `types { ... }` block here would REPLACE that map
    # entirely, so every extension not listed — .png, .txt, .webmanifest — would be
    # served as application/octet-stream. Don't reintroduce one.
    default_type application/octet-stream;

    # ---- Gzip (text assets) ----
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Security headers live in a snippet because nginx's `add_header` does NOT
    # accumulate: a location block that declares even one add_header discards every
    # inherited one. Each location that sets a header must therefore re-include the
    # full set. X-Frame-Options is deliberately absent — the game is meant to be
    # embeddable in iframes (see README §5).
    include /etc/nginx/snippets/security-headers.conf;

    # ---- Caching ----
    # HTML: always revalidate, so a new release is picked up immediately.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # JS/CSS: revalidate on every request (ETag -> 304, ein paar hundert Byte).
    #
    # Vorher: max-age=1 Jahr + immutable, korrekt nur solange jemand bei JEDEM
    # Release das ?v= in index.html mitzieht. Das ging beim ersten Release schief —
    # der Deploy war grün, der Server hatte die neue Datei, und die Browser aller
    # bisherigen Besucher fragten wegen `immutable` nicht einmal mehr nach.
    #
    # Ein Bundle von ~150 KB rechtfertigt diese Klasse von Fehler nicht. Ohne
    # Content-Hash im Dateinamen (= ohne Build-Schritt) ist Revalidieren die
    # ehrliche Variante: der Preis ist ein bedingter Request pro Aufruf.
    location ~* \.(js|css)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Share-card image: a day is plenty and lets scrapers refresh.
    location ~* \.(png|ico|svg)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ---- Routes ----
    # Kein Client-Routing, also auch kein SPA-Fallback: unbekannte Pfade müssen 404
    # liefern. Vorher fiel alles auf /index.html zurück und /impressum antwortete mit
    # HTTP 200 und dem Spiel — ein vertippter Link auf einen Rechtstext wäre damit
    # unsichtbar geblieben, und Suchmaschinen hätten beliebig viele Duplikate gesehen.
    #
    # "/" funktioniert weiter: $uri/ trifft das Wurzelverzeichnis, die index-Direktive
    # leitet intern auf /index.html um — und trifft dabei den Cache-Block oben.
    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
