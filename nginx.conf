# AssetIdent game — nginx server config
# Listens on 8080 so the container can run under Coolify / standard hosts without
# needing a privileged port.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root         /usr/share/nginx/html;
    index        index.html;

    # MIME types come from the base image's /etc/nginx/mime.types (included in the
    # http block). An inline `types { ... }` block here would REPLACE that map
    # entirely, so every extension not listed — .png, .txt, .webmanifest — would be
    # served as application/octet-stream. Don't reintroduce one.
    default_type application/octet-stream;

    # ---- Gzip (text assets) ----
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Security headers live in a snippet because nginx's `add_header` does NOT
    # accumulate: a location block that declares even one add_header discards every
    # inherited one. Each location that sets a header must therefore re-include the
    # full set. X-Frame-Options is deliberately absent — the game is meant to be
    # embeddable in iframes (see README §5).
    include /etc/nginx/snippets/security-headers.conf;

    # ---- Caching ----
    # HTML: always revalidate, so a new release is picked up immediately.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # JS/CSS: cached for a year. Safe ONLY because index.html requests them with a
    # ?v=<version> query string, which is part of the cache key — bump it on release.
    location ~* \.(js|css)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Share-card image: a day is plenty and lets scrapers refresh.
    location ~* \.(png|ico|svg)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ---- Routes ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
