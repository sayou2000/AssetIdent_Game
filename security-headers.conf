# Shared security headers.
#
# Included separately into every location that sets its own add_header, because
# nginx replaces — never merges — the inherited add_header set as soon as a block
# declares one of its own.
#
# X-Frame-Options is intentionally NOT set: the game is designed to be embedded
# via <iframe> (README §5). Restrict embedding to your own domains by replacing
# the frame-ancestors line below.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Everything the game needs is same-origin: no CDN, no external fonts, no images.
# 'unsafe-inline' covers the small config script in index.html.
# connect-src stays open for the optional analytics endpoint (window.ASSETIDENT_API).
# To lock embedding down, change frame-ancestors to e.g.
#   frame-ancestors 'self' https://*.deine-domain.de;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src *; base-uri 'self'; form-action 'self'; frame-ancestors *" always;
